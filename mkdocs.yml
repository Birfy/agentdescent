site_name: Concordia
site_description: A parallel, self-evolving framework for accelerating RSI
repo_url: https://github.com/Birfy/concordia
repo_name: Birfy/concordia
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Concepts: concepts.md
  - The evolve method: evolution.md
  - Building blocks (plug into evolve):
    - Connecting agents & LLMs: agents.md
    - Loading datasets (the data layer): dataloader.md
    - The aggregator (the optimizer): aggregator.md
    - Customizable parallelism (DP/TP/PP): parallelism.md
    - Duration-aware scheduling: duration-scheduling.md
    - Efficiency experiments: efficiency.md
  - Complete example — skill evolution: skill-evolution.md
  - Self-evolution algorithms (faithful ports): self-evolution-examples.md
  - Usage & extending: usage.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Birfy/concordia
