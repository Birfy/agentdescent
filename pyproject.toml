[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdescent"
dynamic = ["version"]
description = "Gradient descent, but the parameters are agents — a parallel, asynchronous framework for self-evolving agents (skills, prompts, harnesses)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AgentDescent" }]
keywords = ["rsi", "self-evolving-agents", "parallel", "aggregation", "staleness"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
docs = ["mkdocs-material>=9.5"]
# The MCP server (`agentdescent mcp`) needs the protocol SDK; the CLI does not.
mcp = ["mcp>=1.2"]

[project.scripts]
agentdescent = "agentdescent.cli:main"

[project.urls]
Homepage = "https://github.com/Birfy/agentdescent"

[tool.setuptools.dynamic]
# Single-sourced: agentdescent/__init__.py is the only place the version
# lives. It used to be duplicated here, and drifted -- __version__ said
# 0.7.0 while every wheel, the PyPI page and the README badge said 0.2.0.
version = { attr = "agentdescent.__version__" }

[tool.setuptools.packages.find]
include = ["agentdescent*"]

[tool.setuptools.package-data]
# The shared skill and hooks the `install` command writes into a host.
agentdescent = ["integrations/*.md", "integrations/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the repo root on sys.path so `import agentdescent` / `import examples`
# resolve under a bare `pytest` invocation (CI), not just `python -m pytest`.
pythonpath = ["."]
