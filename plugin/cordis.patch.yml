# The layer this bundle contributes. A profile listing `dsh-plugin-agentdescent`
# applies it after `@deepseek-ai/dsh-base`, so these rows see the base tree.
#
# Override any field from your profile's own `cordis.patch.yml` by restating the
# row id with the whole `config` block -- a patch replaces a config, it does not
# deep-merge it.
- insert:
    # The capability seam. Mounted separately from the provider so a different
    # optimiser can replace the row below without touching the tool or command.
    - id: evolution
      name: dsh-plugin-agentdescent/evolution

    - id: evolution-agentdescent
      name: dsh-plugin-agentdescent
      inject: [evolution, agents, skills, commands, tools]
      config:
        # Where the optimiser sidecar runs. It must be a directory the
        # `agentdescent` Python package imports from.
        cwd: !!js process.env.AGENTDESCENT_HOME
        python: python3
        # Skills merge on held-out score; anything harness-shaped waits for a
        # person in `/evolve pending`.
        autoMergeMaxBlastRadius: 0.2
        # Nothing is evolvable until you say what is. Each entry becomes a
        # `skill:<name>` artifact:
        #   skills:
        #     - { name: sql, dir: /home/you/.dsh/skills/sql }
        # and each plugin entry a `plugin:<name>` artifact at L1:
        #   plugins:
        #     - { name: dsh-plugin-mine, dir: /home/you/src/dsh-plugin-mine }
        # ---- the two decisions that are yours -------------------------------
        #
        # WHICH TASKS. A JSONL file of {"prompt": ..., "gold": ...} per line;
        # a line that is not JSON is taken as a bare prompt, so a plain list of
        # questions is a valid dataset.
        #   datasets:
        #     - { name: sql-regressions, file: /home/you/data/sql.jsonl }
        datasets: []
        #
        # WHAT COUNTS AS BETTER. Four kinds, strongest signal first:
        #   objectives:
        #     - { name: right-answer, kind: gold, match: contains }
        #     - { name: runs-on-my-db, kind: command,
        #         run: ["psql", "--quiet", "-f", "{output}"] }
        #     - { name: house-style, kind: judge, rubric: |
        #           snake_case table names. Never SELECT *.
        #           Never touch anything under migrations/. }
        #     - { name: better-than-before, kind: replay }
        # `all` stacks them as an AND (the score is the minimum), and
        # `efficiency: true` on any of them rewards doing it in fewer steps --
        # behind a hard pass gate, so cheap can never buy off wrong:
        #     - { name: correct-and-cheap, kind: all, efficiency: true,
        #         of: [{ kind: gold }, { kind: command, run: ["make", "check"] }] }
        objectives: []
        # ---------------------------------------------------------------------
        skills: []
        # A whole root, where a run may *add* skills and retire them -- the only
        # setting under which evolution discovers rather than refines:
        #   libraries:
        #     - { name: user, dir: /home/you/.dsh/skills }
        libraries: []
        plugins: []
        # Left empty on purpose. With entries here the harness starts these runs
        # by itself once everything has been quiet for `idleAfterMs`, and stops
        # them the moment you come back:
        #   idleRuns:
        #     - { artifact: skill:sql, scorer: gold, taskSource: manual }
        # Off, and worth leaving off until you mean it: replaying a past turn
        # sends its content to the model provider again. Needs
        # @deepseek-ai/dsh-session-query mounted.
        harvestTranscripts: false
        idleRuns: []
        idleAfterMs: 300000
        idleMinIntervalMs: 3600000
