name: labels

# Sync the repository labels with .github/labels.json (see AGENTS.md › Labels).
# Creates and updates only: it never deletes a label and never touches one that
# labels.json does not list. Runs on a push to main that changes the list, or by
# hand. Built-in GITHUB_TOKEN only; the script comes from the default branch, so
# no pull-request code runs with the write permission.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/scripts/sync_labels.py
  workflow_dispatch:

concurrency:
  group: labels
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/sync_labels.py --apply
