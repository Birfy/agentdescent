name: docs

# Every PR builds and strict-validates the MkDocs site. Pushes to main also deploy.
# Deploy used to be manual-only, so that a push could not fail on a repository
# where Pages was off. Pages is on now, and the guard had outlived it: the site
# went stale silently, and README links to pages that only existed in the
# source tree returned 404 -- which is worse than the red run it was avoiding.
# `workflow_dispatch` is kept for re-publishing without a commit.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs cancel only earlier runs for the same PR. Main/manual Pages runs
  # keep their existing group and cannot be canceled by a PR validation.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/javascript/experience.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # cairosvg loads libcairo at runtime; the social plugin needs it to
      # render the per-page cards, and the build fails without it.
      - run: sudo apt-get update && sudo apt-get install -y libcairo2
      - run: pip install "mkdocs-material[imaging]>=9.5"
      - run: mkdocs build --clean --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # A push to main, or a manual re-publish. Anything else -- a PR build --
    # validates and stops, because a fork's build must never reach Pages.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
