name: docs

# Builds the MkDocs site on every push (validates docs) and deploys it to
# GitHub Pages. To publish: repo Settings -> Pages -> Source: "GitHub Actions".
# Note: GitHub Pages on a *private* repo requires a paid plan; the build job
# still runs and validates the docs regardless.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "mkdocs-material>=9.5"
      - run: mkdocs build --clean --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
