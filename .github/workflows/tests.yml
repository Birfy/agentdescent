name: tests

# Run the offline test suite on every push / PR, across supported Python versions.
# The core engine has no required dependencies and the tests hit no network, so
# this is fast and deterministic.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The TypeScript bundle under plugin/. It ships to npm rather than PyPI and
  # has its own toolchain, so it gets its own job -- a Python-only change should
  # not pay for a Node install, and a plugin-only change should not wait on the
  # three-version Python matrix.
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The plugin's last test spawns the real Python engine and drives a whole
      # run through the bridge. It is the only test that can catch the two
      # halves drifting apart, and it skips itself when the package is not
      # importable -- so CI installs it rather than letting that test quietly
      # pass by doing nothing.
      - run: pip install -e ..
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # The published artifact is the built one: a consumer installs `lib/`,
      # never `src/`. Building here is what keeps "it typechecks" from being
      # mistaken for "it ships".
      - run: npm run build
