name: tests

# Run the offline test suite on every push / PR, across supported Python versions.
# The core engine has no required dependencies and the tests hit no network, so
# this is fast and deterministic.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # `[mcp]` too, or the MCP server -- the plugin surface this project
      # exposes to agents -- is never exercised: `test_mcp.py` and half of
      # `test_host_sampling.py` `importorskip` it and pass by doing nothing.
      # The extra carries a `python_version >= '3.10'` marker, so 3.9 installs
      # the CLI alone and those tests skip there, which is the supported shape.
      - run: pip install -e ".[dev,mcp]"
      - run: pytest -q
